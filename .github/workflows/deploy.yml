name: Deploy a new version

on:
  workflow_dispatch:
    inputs:
      version-tag:
        description: Version tag
        required: true
        default: v0.1.0
      dry-run:
        description: Dry run
        type: boolean
        default: false
      exclude-types:
        description: Commit types to exclude from the changelog
        required: false
        default: build,docs,style,other

jobs:
  commit-changelog-and-release:
    uses: deargen/workflows/.github/workflows/commit-changelog-and-release.yml@master
    with:
      version-tag: ${{ github.event.inputs.version-tag }}
      dry-run: ${{ github.event.inputs.dry-run == 'true' }}
      changelog-path: docs/CHANGELOG.md
      exclude-types: ${{ github.event.inputs.exclude-types }}

  # Below is generated by maturin
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-24.04
            target: aarch64
          - runner: ubuntu-24.04
            target: armv7
          - runner: ubuntu-24.04
            target: s390x
          - runner: ubuntu-24.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'false' }}
        with:
          ref: ${{ github.event.inputs.version-tag }}
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Update version in Cargo.toml
        run: |
          pip3 install toml
          python3 scripts/update_version_in_cargo_toml.py ${{ github.event.inputs.version-tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'false' }}
        with:
          ref: ${{ github.event.inputs.version-tag }}
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Update version in Cargo.toml
        run: |
          pip3 install toml
          python3 scripts/update_version_in_cargo_toml.py ${{ github.event.inputs.version-tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'false' }}
        with:
          ref: ${{ github.event.inputs.version-tag }}
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Update version in Cargo.toml
        run: |
          pip3 install toml
          python3 scripts/update_version_in_cargo_toml.py ${{ github.event.inputs.version-tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          # maturin doesn't support 3.13t and pypy on windows yet
          args: --release --out dist --interpreter 3.9 3.10 3.11 3.12 3.13 3.14
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-13
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'false' }}
        with:
          ref: ${{ github.event.inputs.version-tag }}
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'true' }}
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - name: Update version in Cargo.toml
        run: |
          pip3 install toml
          python3 scripts/update_version_in_cargo_toml.py ${{ github.event.inputs.version-tag }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter 3.9 3.10 3.11 3.12 3.13 3.13t 3.14 3.14t pypy3.11
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'false' }}
        with:
          ref: ${{ github.event.inputs.version-tag }}
      - uses: actions/checkout@v5
        if: ${{ github.event.inputs.dry-run == 'true' }}
      - name: Update version in Cargo.toml
        run: |
          pip3 install toml
          python3 scripts/update_version_in_cargo_toml.py ${{ github.event.inputs.version-tag }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    if: ${{ github.event.inputs.dry-run == 'false' }}
    runs-on: ubuntu-24.04
    needs:
      [linux, musllinux, windows, macos, sdist, commit-changelog-and-release]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'wheels-*/*'
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
